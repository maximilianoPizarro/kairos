apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: kairos-demo
  labels:
    app: demo-app
    kairos.io/managed: 'true'
  annotations:
    deployment.kubernetes.io/revision: '1'
    kairos.io/managed: 'true'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        kairos.io/managed: 'true'
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
