name: Kairos Operator CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag override (e.g. v2.1.0-rc1)'
        required: true

env:
  REGISTRY: quay.io
  GHCR_REGISTRY: ghcr.io
  IMAGE_BASE: quay.io/maximilianopizarro
  OPERATOR_IMG: quay.io/maximilianopizarro/kairos-operator
  CONSOLE_IMG: quay.io/maximilianopizarro/kairos-console
  BUNDLE_IMG: quay.io/maximilianopizarro/kairos-operator-bundle
  CATALOG_IMG: quay.io/maximilianopizarro/kairos-operator-catalog
  GHCR_OPERATOR_IMG: ghcr.io/maximilianopizarro/kairos-operator
  GHCR_CONSOLE_IMG: ghcr.io/maximilianopizarro/kairos-console
  GO_VERSION: '1.25'
  OPERATOR_SDK_VERSION: 'v1.40.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    - name: Run tests
      run: make test
    - name: Run linter
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        golangci-lint run
    - name: Verify manifests are up to date
      run: |
        make generate manifests
        git diff --exit-code

  build-and-push:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Set image tag
      id: tag
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "tag=latest" >> $GITHUB_OUTPUT
        fi

    - name: Login to Quay.io
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.GHCR_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push operator image
      run: |
        make docker-build IMG=${{ env.OPERATOR_IMG }}:${{ steps.tag.outputs.tag }} CONTAINER_TOOL=docker
        make docker-push IMG=${{ env.OPERATOR_IMG }}:${{ steps.tag.outputs.tag }} CONTAINER_TOOL=docker
        docker tag ${{ env.OPERATOR_IMG }}:${{ steps.tag.outputs.tag }} ${{ env.GHCR_OPERATOR_IMG }}:${{ steps.tag.outputs.tag }}
        docker push ${{ env.GHCR_OPERATOR_IMG }}:${{ steps.tag.outputs.tag }}

    - name: Build and push console image
      run: |
        make docker-build-console CONSOLE_IMG=${{ env.CONSOLE_IMG }}:${{ steps.tag.outputs.tag }} CONTAINER_TOOL=docker
        make docker-push-console CONSOLE_IMG=${{ env.CONSOLE_IMG }}:${{ steps.tag.outputs.tag }} CONTAINER_TOOL=docker
        docker tag ${{ env.CONSOLE_IMG }}:${{ steps.tag.outputs.tag }} ${{ env.GHCR_CONSOLE_IMG }}:${{ steps.tag.outputs.tag }}
        docker push ${{ env.GHCR_CONSOLE_IMG }}:${{ steps.tag.outputs.tag }}

    - name: Build and push bundle
      run: |
        make bundle IMG=${{ env.OPERATOR_IMG }}:${{ steps.tag.outputs.tag }}
        docker build -f bundle.Dockerfile -t ${{ env.BUNDLE_IMG }}:${{ steps.tag.outputs.tag }} .
        docker push ${{ env.BUNDLE_IMG }}:${{ steps.tag.outputs.tag }}

    - name: Tag as latest
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        docker tag ${{ env.OPERATOR_IMG }}:${{ steps.tag.outputs.tag }} ${{ env.OPERATOR_IMG }}:latest
        docker tag ${{ env.CONSOLE_IMG }}:${{ steps.tag.outputs.tag }} ${{ env.CONSOLE_IMG }}:latest
        docker tag ${{ env.GHCR_OPERATOR_IMG }}:${{ steps.tag.outputs.tag }} ${{ env.GHCR_OPERATOR_IMG }}:latest
        docker tag ${{ env.GHCR_CONSOLE_IMG }}:${{ steps.tag.outputs.tag }} ${{ env.GHCR_CONSOLE_IMG }}:latest
        docker push ${{ env.OPERATOR_IMG }}:latest
        docker push ${{ env.CONSOLE_IMG }}:latest
        docker push ${{ env.GHCR_OPERATOR_IMG }}:latest
        docker push ${{ env.GHCR_CONSOLE_IMG }}:latest
