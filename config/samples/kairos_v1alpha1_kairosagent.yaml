apiVersion: kairos.maximilianopizarro.github.io/v1alpha1
kind: KairosAgent
metadata:
  name: hub-agent
  namespace: kairos-system
  labels:
    app.kubernetes.io/managed-by: kairos-operator
spec:
  mode: supervised
  aiModel:
    # OpenAI-compatible base URL (Kairos appends /chat/completions)
    # Example: https://<your-litellm-or-vllm-host>/v1
    apiURL: "https://<your-openai-compatible-endpoint>/v1"
    model: "Granite-Vision-3.2"
    apiKeySecret:
      name: kairos-ai-credentials
      key: api-key
    timeoutSeconds: 60
    temperature: "0.2"
  watch:
    namespaces:
    - kairos-system
    - kairos-demo
    resourceTypes:
    - Deployment
    - StatefulSet
    labelSelector: "kairos.io/managed=true"
  correctionPolicy:
    maxActionsPerHour: 10
    requireApprovalAbove: "30%"
    rollbackOnFailure: true
    dryRun: true
  reporting:
    interval: "30s"
    otelExport: true
  paused: false
---
# Credentials must NEVER be committed. Create them locally only:
#   oc create secret generic kairos-ai-credentials -n kairos-system \
#     --from-literal=api-key="$LITELLM_API_KEY"
